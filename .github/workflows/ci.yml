name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ReceiptIQ.sln

      - name: Build
        run: dotnet build ReceiptIQ.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ReceiptIQ.sln --no-build --configuration Release
