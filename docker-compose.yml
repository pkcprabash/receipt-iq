services:
  postgres:
    image: postgres:16-alpine
    container_name: receiptiq-postgres
    environment:
      POSTGRES_USER: receiptiq
      POSTGRES_PASSWORD: receiptiq
      POSTGRES_DB: receiptiq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptiq -d receiptiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
